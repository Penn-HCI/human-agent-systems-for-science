<svg xmlns="http://www.w3.org/2000/svg" width="423" height="386" viewBox="0 0 423 386">
  <!-- Penn HCI's arrangement (https://www.pennhci.com/), with a flask -->
  <!-- Flask (was the large green triangle) -->
  <g fill="#46a298" opacity="0.2">
    <rect x="168" y="20" width="87" height="16" rx="6"/>
    <path d="M181,32 V150 L12,360 Q0,386 30,386 H393 Q423,386 411,360 L242,150 V32 Z"/>
  </g>
  <!-- Pink triangle with two robot arms: out to an elbow, down to C-shaped clamps below it -->
  <!-- Scaled to 70% around its bottom-left corner, where it overlaps the flask -->
  <g fill="none" stroke="#ee3d6e" stroke-linecap="round" stroke-linejoin="round" opacity="0.441"
     transform="translate(218 151) scale(0.7) translate(-218 -151)">
    <path d="M305.5,0 L393,151 H218 Z" fill="#ee3d6e" stroke="none"/>
    <path d="M258,82 Q216,88 206,134 M353,82 Q395,88 405,134" stroke-width="9"/>
    <path d="M196.5,151 A11,11 0 1 1 215.5,151 M395.5,151 A11,11 0 1 1 414.5,151" stroke-width="6"/>
  </g>
  <!-- Two heads in profile (were the dot grids), facing each other -->
  <defs><path id="head" d="M32,120 C30,108 28,100 26,96 C8,86 2,52 14,30 C26,8 58,0 76,12 C90,22 92,36 89,46 L99,62 L90,66 C93,70 92,73 88,74 C92,77 92,80 89,82 C91,88 88,93 78,93 C72,93 70,96 70,104 L71,120 Z"/></defs>
  <g fill="#4a72b7" opacity="0.421">
    <use href="#head" transform="translate(108 22) scale(0.9)"/>
    <use href="#head" transform="translate(374 199) scale(-1.275 1.275)"/>
  </g>
</svg>
